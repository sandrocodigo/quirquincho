<h2 mat-dialog-title>Subir comprobante de Pago</h2>
<mat-divider></mat-divider>
@if (registroFormGroup) {
  <form (ngSubmit)="onSubmit()" [formGroup]="registroFormGroup">
    <mat-dialog-content class="flex flex-col gap-4 !pt-4">
      
      <!-- QR Code Section -->
      <div class="flex flex-col items-center justify-center p-3 border border-dashed border-slate-200 dark:border-slate-700 rounded-xl bg-slate-50/50 dark:bg-slate-800/20">
        <p class="text-xs text-slate-500 dark:text-slate-400 mb-2 font-semibold uppercase tracking-wider">Escanee el QR para realizar la transferencia:</p>
        <img src="imagenes/QR-Sandro.jpeg" alt="Código QR de Pago" class="w-44 h-44 object-contain rounded-lg shadow-sm border border-white dark:border-slate-800" />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-xs font-semibold text-slate-500 dark:text-slate-400">Seleccionar archivo del comprobante:</label>
        <input type="file" (change)="onFileSelected($event)" class="text-sm file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 dark:file:bg-slate-800 dark:file:text-slate-300 hover:file:bg-blue-100 transition-colors" />
      </div>

      <mat-form-field class="flex-auto w-full mt-2">
        <mat-label>Descripción del comprobante</mat-label>
        <input matInput autocomplete="off" placeholder="Ej. Transferencia Banco Unión"
          formControlName="comprobanteDescripcion">
        @if (registroControl && r.comprobanteDescripcion.errors && r.comprobanteDescripcion.errors.required) {
          <mat-error>
            Se requiere la descripción del comprobante
          </mat-error>
        }
      </mat-form-field>
    </mat-dialog-content>
    <mat-divider></mat-divider>
    <mat-dialog-actions align="end">
      <button mat-button mat-dialog-close type="button">Cancelar</button>
      <button color="primary" mat-flat-button type="submit"> Aceptar</button>
    </mat-dialog-actions>
  </form>
}
