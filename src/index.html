<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Quirquincho PRO 2026</title>
  <base href="/">

  <meta name="author" content="miapppro.com">
  <meta name="description" content="App de Gestion Administrativa para Grupo Empresarial Quirquincho">
  <meta property="og:title" content="Grupo Empresarial Quirquincho">
  <meta property="og:description" content="TRANSPORTE | SEGURIDAD | INNOVACION">
  <meta property="og:type" content="website" />

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
  <!-- Estilos Inline de Splash Screen Ultra Rápida para Móvil y Desktop -->
  <style>
    #app-splash-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #020617;
      color: #f8fafc;
      font-family: 'Roboto', sans-serif;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s ease;
      overflow: hidden;
    }

    #app-splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .splash-bg-glow {
      position: absolute;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.25) 0%, rgba(132, 204, 22, 0.05) 50%, transparent 70%);
      border-radius: 50%;
      filter: blur(50px);
      animation: splashPulse 3s ease-in-out infinite alternate;
    }

    @keyframes splashPulse {
      0% {
        transform: scale(0.9);
        opacity: 0.5;
      }

      100% {
        transform: scale(1.2);
        opacity: 1;
      }
    }

    .splash-logo-container {
      position: relative;
      width: 110px;
      height: 110px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 28px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1);
      animation: logoBounce 2s ease-in-out infinite;
    }

    @keyframes logoBounce {
      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-8px) scale(1.03);
      }
    }

    .splash-logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .splash-title {
      margin-top: 24px;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #10b981, #059669, #84cc16);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    .splash-subtitle {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #94a3b8;
      text-align: center;
    }

    .splash-loader-bar {
      margin-top: 32px;
      width: 160px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .splash-loader-progress {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #10b981, #059669, #84cc16);
      border-radius: 999px;
      animation: splashLoading 1.5s ease-in-out infinite;
    }

    @keyframes splashLoading {
      0% {
        left: -100%;
      }

      100% {
        left: 100%;
      }
    }
  </style>

  <!-- Splash Screen que se muestra antes del bootstrapping de Angular -->
  <div id="app-splash-screen">
    <div class="splash-bg-glow"></div>

    <div class="splash-logo-container">
      <img src="logo/quirquincho.jpg" alt="Quirquincho Logo" style="border-radius: 20px; object-fit: cover;" />
    </div>

    <div class="splash-title">QUIRQUINCHO</div>
    <div class="splash-subtitle">Admin Portal V2.0</div>

    <div class="splash-loader-bar">
      <div class="splash-loader-progress"></div>
    </div>
  </div>

  <app-root></app-root>
</body>

</html>
